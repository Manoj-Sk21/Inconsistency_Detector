<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Inconsistency Detector — Demo</title>
  <style>
  body { 
    font-family: Arial, sans-serif; 
    margin: 18px; 
    background:#f6f8fb; 
    color:#111; 
    font-size: 18px;   /* increased base font */
  }

  .container { 
    max-width: 1100px; 
    margin: 0 auto; 
    background: #fff; 
    padding: 22px; 
    border-radius:10px; 
    box-shadow: 0 6px 18px rgba(20,30,50,0.12); 
  }

  h2 { font-size: 28px; }

  label { font-size: 20px; font-weight: 600; }

  textarea { 
    width:100%; 
    height:120px; 
    padding:12px; 
    border-radius:8px; 
    border:1px solid #ccc; 
    resize:vertical; 
    font-size: 18px;        /* bigger text */
  }

  button { 
    background:#1762ff; 
    color:white; 
    border:0; 
    padding:12px 18px; 
    border-radius:8px; 
    cursor:pointer; 
    font-size: 18px;        /* bigger buttons */
  }
  button.secondary { background:#333; }

  .results { margin-top:18px; }

  .card { 
    background:#fafbff; 
    padding:16px; 
    border-radius:10px; 
    border:1px solid #eee; 
    margin-bottom:12px;
    font-size: 18px; 
  }

  .badge { 
    display:inline-block; 
    padding:8px 12px; 
    border-radius:999px; 
    font-weight:700; 
    font-size:16px; 
    color:white; 
    margin-right:8px; 
  }
  .badge.high { background:#e53935; }
  .badge.medium { background:#f59e0b; }
  .badge.low { background:#10b981; }

  .top-panel { display:flex; gap:16px; margin-bottom:16px; }
  .top-card { 
    flex:1; 
    padding:16px; 
    border-radius:10px; 
    background:#fff; 
    border:1px solid #e6eefc; 
    font-size:18px;
  }

  .finding { 
    padding:14px; 
    border-radius:10px; 
    background:#fff; 
    border:1px solid #ddd; 
    margin-bottom:10px; 
    font-size: 18px; 
  }

  .small { font-size:16px; color:#555; }

  pre { 
    background:#0f1724; 
    color:#e6eefc; 
    padding:14px; 
    border-radius:8px; 
    overflow:auto; 
    max-height:400px; 
    font-size: 16px; 
  }
</style>

</head>
<body>
  <div class="container">
    <h2>Inconsistency Detector — Case Analysis MVP</h2>

    <div class="row">
      <div class="col">
        <label>Witness 1 Statement</label>
        <textarea id="w1">Witness A: I saw a man wearing a red shirt at around 8:30 PM near Park Road. He was riding a vehicle KA 01 AB 1234.</textarea>
      </div>
      <div class="col">
        <label>Witness 2 Statement</label>
        <textarea id="w2">Witness B: The person wore a black shirt and passed the area at around 8:52 PM. I think the bike had a different number.</textarea>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>FIR</label>
        <textarea id="fir">FIR: Complainant states the suspect wore a red shirt and snatched the bag at approximately 8:30 PM. Witnesses mentioned a vehicle KA01AB1234.</textarea>
      </div>
      <div class="col">
        <label>CCTV Summary</label>
        <textarea id="cctv">CCTV Footage: At 20:52, a person is seen walking fast. Shirt color unclear. No readable vehicle plate.</textarea>
      </div>
    </div>

    <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
      <button id="analyzeBtn">Analyze</button>
      <button id="exportBtn" class="secondary">Export PDF</button>
      <div class="small">Use this to generate a short report for detectives.</div>
    </div>

    <!-- Top 3 findings panel -->
    <div class="top-panel" id="topPanel" style="display:none">
      <div class="top-card">
        <strong>Top 3 Findings</strong>
        <div id="topList" style="margin-top:8px"></div>
      </div>
      <div class="top-card">
        <strong>Quick Action</strong>
        <div style="margin-top:8px" id="actions">
          <div class="small">1. Re-interview plate witness</div>
          <div class="small">2. Validate CCTV timestamp</div>
          <div class="small">3. Confirm clothing via canvass</div>
        </div>
      </div>
    </div>

    <!-- Results + explanation -->
    <div class="results">
      <div class="card">
        <strong>Explanation</strong>
        <div id="explanation" style="margin-top:8px" class="small">Press Analyze to run detection.</div>
      </div>

      <div class="card">
        <strong>Conflicts</strong>
        <div id="conflictList" style="margin-top:10px"></div>
      </div>

      <div class="card">
        <strong>Similarity Scores</strong>
        <div id="sims" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

<script>
function severityFor(conflict) {
  const high = ["TIME_MISMATCH","VEHICLE_MISMATCH"];
  const medium = ["PERSON_MISMATCH","COLOR_MISMATCH"];
  const low = ["MISSING_DETAIL"];
  if (high.includes(conflict.type)) return 3;
  if (medium.includes(conflict.type)) return 2;
  if (low.includes(conflict.type)) return 1;
  return 1;
}
function badgeForSeverity(score) {
  if (score >= 3) return '<span class="badge high">High</span>';
  if (score == 2) return '<span class="badge medium">Medium</span>';
  return '<span class="badge low">Low</span>';
}

document.getElementById('analyzeBtn').addEventListener('click', async ()=>{
  const w1 = document.getElementById('w1').value;
  const w2 = document.getElementById('w2').value;
  const fir = document.getElementById('fir').value;
  const cctv = document.getElementById('cctv').value;

  document.getElementById('explanation').innerText = 'Analyzing...';
  document.getElementById('conflictList').innerHTML = '';
  document.getElementById('sims').innerText = '';

  const resp = await fetch('/analyze', {
    method:'POST',
    headers:{'Content-Type': 'application/json'},
    body: JSON.stringify({witness1: w1, witness2: w2, fir: fir, cctv: cctv})
  });
  const data = await resp.json();

  const conflicts = data.conflicts || [];
  const withScores = conflicts.map(c => ({...c, score: severityFor(c)}));
  withScores.sort((a,b) => b.score - a.score);

  const topPanel = document.getElementById('topPanel');
  const topList = document.getElementById('topList');
  topList.innerHTML = '';
  if (withScores.length) {
    topPanel.style.display = 'flex';
    withScores.slice(0,3).forEach((c,idx)=>{
      const badge = badgeForSeverity(c.score);
      const title = c.type.replace(/_/g,' ');
      let desc = JSON.stringify(c).replace(/^{|}$/g,'');
      topList.innerHTML += `<div class="finding">${badge}<strong> ${title}</strong><div class="small">${desc}</div></div>`;
    });
  } else {
    topPanel.style.display = 'none';
  }

  document.getElementById('explanation').innerHTML = data.explanation || 'No explanation provided';

  const conflictList = document.getElementById('conflictList');
  conflictList.innerHTML = '';
  withScores.forEach(c=>{
    const sevBadge = badgeForSeverity(c.score);
    const title = c.type.replace(/_/g,' ');
    const details = document.createElement('div');
    details.className = 'finding';
    details.innerHTML = `${sevBadge} <strong>${title}</strong><div class="small">${JSON.stringify(c)}</div>`;
    conflictList.appendChild(details);
  });

  document.getElementById('sims').innerHTML = (data.similarities || []).map(s=>`<div class="small">${s.pair.join(' ↔ ')} : ${s.similarity}</div>`).join('');
});

// Export PDF
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const payload = {
    witness1: document.getElementById('w1').value,
    witness2: document.getElementById('w2').value,
    fir: document.getElementById('fir').value,
    cctv: document.getElementById('cctv').value
  };
  const resp = await fetch('/export_pdf', {
    method:'POST',
    headers:{'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (!resp.ok) {
    const t = await resp.text();
    alert('Export failed: ' + t);
    return;
  }
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'Inconsistency_Report.pdf';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
